name: Sombra Android

on:
  push:
    branches: ['claude/**']
    paths: ['SombraApp/**', '.github/workflows/sombra-android.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Commitar screenshots e publicar o APK numa release'
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: SombraApp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitários + APK debug
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sombra-debug-apk
          path: SombraApp/app/build/outputs/apk/debug/app-debug.apk

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: SombraApp
          script: bash ci/run-shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sombra-screenshots
          path: SombraApp/shots/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sombra-test-report
          path: SombraApp/app/build/reports/androidTests
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [build, screenshots]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sombra-debug-apk, path: out/apk }
      - uses: actions/download-artifact@v4
        with: { name: sombra-screenshots, path: out/shots }
      - name: Commitar screenshots
        working-directory: .
        run: |
          mkdir -p SombraApp/docs/screenshots
          cp out/shots/*.png SombraApp/docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SombraApp/docs/screenshots
          git diff --cached --quiet || git commit -m "docs(sombra): atualiza screenshots gerados no emulador [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Publicar APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/apk/app-debug.apk Sombra-debug.apk
          gh release delete sombra-latest --yes --cleanup-tag || true
          gh release create sombra-latest Sombra-debug.apk --prerelease --target "${GITHUB_SHA}" \
            --title "Sombra (build de teste)" --notes "APK debug gerado pelo CI a partir de ${GITHUB_SHA}."
